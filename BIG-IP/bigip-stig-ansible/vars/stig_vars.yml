#   - demo.f5demo.local

# SSL/TLS Cipher Configurations
# client_ssl_ciphers: "HIGH:!RSA:!DES:!TLSv1:!TLSv1_1:!SSLv3:!ECDHE-RSA-AES256-CBC-SHA:@STRENGTH"
# server_ssl_ciphers: "HIGH:!RSA:!DES:!TLSv1:!TLSv1_1:!SSLv3:!ECDHE-RSA-AES256-CBC-SHA:@STRENGTH"

# NTP Management Route (if needed)
